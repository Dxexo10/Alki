<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alki — Bienvenida</title>
<link rel="stylesheet" href="design-system.css">
<style>
/* ── Splash Specific Layout ── */
.splash-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background: var(--bg-primary);
}

.splash-bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 110% 70% at 50% 0%, var(--holst-2) 0%, var(--holst-1) 45%, var(--bg-primary) 75%),
    radial-gradient(ellipse 80% 50% at 90% 25%, rgba(110, 158, 204, 0.25) 0%, transparent 60%);
}

.splash-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(44px);
  opacity: 0.45;
  pointer-events: none;
}
.splash-orb-1 {
  width: 220px; height: 220px;
  background: radial-gradient(circle, var(--holst-4) 0%, transparent 70%);
  top: 40px; left: -50px;
}
.splash-orb-2 {
  width: 180px; height: 180px;
  background: radial-gradient(circle, var(--holst-5) 0%, transparent 70%);
  top: 140px; right: -40px;
}

.splash-hero {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 52%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: var(--statusbar-height);
  z-index: 10;
  text-align: center;
}

.splash-logo-mark {
  width: 88px; height: 88px;
  border-radius: var(--radius-2xl);
  background: rgba(243, 248, 253, 0.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(243, 248, 253, 0.25);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 32px rgba(34, 58, 94, 0.35);
  margin-bottom: var(--sp-4);
  color: var(--text-on-brand);
  animation: rs-spring-drop 1000ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
@keyframes rs-spring-drop {
  from { opacity: 0; transform: translateY(-30px) scale(0.88); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes rs-rise {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes rs-card-in {
  from { opacity: 0; transform: translateY(44px); }
  to   { opacity: 1; transform: translateY(0); }
}
.splash-logo-mark svg {
  width: 48px; height: 48px;
}

.splash-title {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 700;
  letter-spacing: var(--tracking-tight);
  line-height: var(--leading-tight);
  color: var(--text-on-brand);
  margin-bottom: var(--sp-2);
  animation: rs-rise 560ms cubic-bezier(0.34, 1.56, 0.64, 1) 130ms both;
}
.splash-title span {
  color: var(--holst-5);
  font-style: italic;
  font-weight: 400;
}

.splash-tagline {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  font-weight: 400;
  color: var(--holst-6);
  letter-spacing: var(--tracking-normal);
  animation: rs-rise 560ms cubic-bezier(0.34, 1.56, 0.64, 1) 220ms both;
}

.splash-chips {
  display: flex;
  gap: var(--sp-2);
  margin-top: var(--sp-5);
}
.splash-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: var(--radius-full);
  background: rgba(34, 58, 94, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(243, 248, 253, 0.38);
  font-family: var(--font-ui);
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-on-brand);
  box-shadow: 0 2px 8px rgba(34, 58, 94, 0.25);
  animation: rs-rise 520ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
}
.splash-chip:nth-child(1) { animation-delay: 330ms; }
.splash-chip:nth-child(2) { animation-delay: 420ms; }
.splash-chip:nth-child(3) { animation-delay: 510ms; }
.splash-chip svg {
  width: 14px; height: 14px;
  stroke: currentColor;
}

.btn-apple {
  background: #000;
  color: var(--text-on-brand);
  font-weight: 500;
}
.btn-apple svg { fill: currentColor; }

.splash-card {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 32px 28px calc(24px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  z-index: 20;
  background: var(--bg-secondary);
  border-radius: 36px 36px 0 0;
  box-shadow: 0 -8px 32px rgba(34, 58, 94, 0.15);
  border-top: 1px solid var(--separator);
  animation: rs-card-in 620ms cubic-bezier(0.22, 1, 0.36, 1) 260ms both;
}

@media (prefers-reduced-motion: reduce) {
  .splash-logo-mark,
  .splash-title,
  .splash-tagline,
  .splash-chip,
  .splash-card {
    animation: rs-fade-in 200ms ease both;
    animation-delay: 0ms !important;
  }
}

.splash-legal {
  text-align: center;
  font-family: var(--font-ui);
  font-size: var(--text-xs);
  color: var(--text-tertiary);
  line-height: var(--leading-relaxed);
  margin-top: var(--sp-2);
}
.splash-legal a {
  color: var(--brand-primary);
  text-decoration: underline;
  text-underline-offset: 2px;
}
</style>
</head>
<body>

<div class="phone">
  <!-- Dynamic Island -->
  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar" style="color: var(--text-on-brand);">
    <span class="status-time">9:41</span>
    <div class="status-icons">

      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" fill="currentColor"/><path d="M1.5 5.5C3.4 3.5 5.6 2.5 8 2.5s4.6 1 6.5 3"/><path d="M4 8C5.2 6.7 6.5 6 8 6s2.8.7 4 2"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0" y="1" width="21" height="10" rx="2.5"/><rect x="22" y="3.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.5"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/></svg>

  <!-- Screen Content -->
  <div class="splash-screen">

    </div>

    <!-- Hero / Branding -->
    <div class="splash-hero">
      <div class="splash-logo-mark">
        <!-- Custom clean SVG mark: Pin + Gear/Wrench combo -->

          <path d="M24 6c-7.73 0-14 6.27-14 14 0 10.5 14 22 14 22s14-11.5 14-22c0-7.73-6.27-14-14-14z"/>
          <circle cx="24" cy="20" r="5" stroke-dasharray="2 2"/>
          <path d="M21 17l6 6M27 17l-6 6"/>
        </svg>
      </div>

      <h1 class="splash-title">Al<span>ki</span></h1>
      <p class="splash-tagline">Alquila, ofrece, conéctate.</p>

      <div class="splash-chips">
        <div class="splash-chip">

          Cerca de ti
        </div>
        <div class="splash-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          Herramientas
        </div>
        <div class="splash-chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          Servicios
        </div>
      </div>
    </div>

    <!-- Bottom Actions Card -->
    <div class="splash-card">
      <a href="02-registro.html" class="btn btn-primary">
        Crear cuenta
      </a>

      <div class="divider">o continúa con</div>

      <a href="04-home-cliente.html" class="btn btn-secondary" style="font-weight: 500;">
        <!-- Clean Google icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        Continuar con Google
      </a>

      <a href="04-home-cliente.html" class="btn btn-apple">
        <!-- Apple icon -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01z"/>

      <p class="splash-legal">

</div>

<script src="shared.js"></script>
</body>
