<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alki — Chat con Proveedor</title>
<link rel="stylesheet" href="design-system.css">
<style>
/* ── Chat Specific Styles ── */
.chat-header {
  position: absolute;
  top: var(--statusbar-height);
  left: 0; right: 0;
  height: var(--header-height);
  display: flex;
  align-items: center;
  padding: 0 var(--sp-3);
  background: var(--header-bg);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--separator);
  z-index: 150;
  gap: var(--sp-2);
}

.chat-user-info {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.chat-avatar-box {
  position: relative;
}
.chat-online-dot {
  position: absolute;
  bottom: 0; right: 0;
  width: 10px; height: 10px;
  background: var(--brand-success);
  border: 1.5px solid var(--bg-primary);
  border-radius: 50%;
}
.chat-name {
  font-family: var(--font-ui);
  font-size: var(--text-base);
  font-weight: 600;
  color: var(--text-primary);
  line-height: var(--leading-tight);
}
.chat-status {
  font-size: 11px;
  color: var(--brand-success);
  font-weight: 500;
}

/* Agreement banner (collapsible) */
.chat-agreement-bar {
  position: absolute;
  top: calc(var(--statusbar-height) + var(--header-height));
  left: 0; right: 0;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-default);
  z-index: 100;
  box-shadow: var(--shadow-xs);
}
.agreement-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px var(--sp-4);
  cursor: pointer;
  background: var(--brand-accent-soft);
}

/* Chat feed */
.chat-feed {
  position: absolute;
  top: calc(var(--statusbar-height) + var(--header-height) + 42px);
  bottom: 74px;
  left: 0; right: 0;
  overflow-y: auto;
  padding: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  scrollbar-width: none;
}
.chat-feed::-webkit-scrollbar { display: none; }

.chat-date-chip {
  align-self: center;
  padding: 3px 12px;
  border-radius: var(--radius-full);
  background: var(--bg-tertiary);
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
  margin: var(--sp-2) 0;
}

.msg {
  max-width: 76%;
  display: flex;
  flex-direction: column;
}
.msg.client {
  align-self: flex-end;
}
.msg.provider {
  align-self: flex-start;
}

.msg-bubble {
  padding: 10px 14px;
  font-size: var(--text-sm);
  line-height: var(--leading-normal);
  word-break: break-word;
}
.msg.client .msg-bubble {
  background: var(--brand-primary);
  color: var(--text-on-dark);
  border-radius: 18px 18px 4px 18px;
}
.msg.provider .msg-bubble {
  background: var(--bg-secondary);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: 18px 18px 18px 4px;
  box-shadow: var(--shadow-xs);
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--text-tertiary);
  margin-top: 3px;
}
.msg.client .msg-meta {
  align-self: flex-end;
}
.msg.provider .msg-meta {
  align-self: flex-start;
}

/* Chat Input Bar */
.chat-input-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 74px;
  padding: 10px var(--sp-3) calc(10px + var(--safe-bottom));
  background: var(--tabbar-bg);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--separator);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  z-index: 150;
}
.chat-input-box {
  flex: 1;
  display: flex;
  align-items: center;
  background: var(--bg-secondary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-full);
  padding: 0 var(--sp-3);
  height: 40px;
}
.chat-input-box input {
  font-size: var(--text-sm);
  color: var(--text-primary);
}
</style>
</head>
<body>

<div class="phone">
  <!-- Dynamic Island -->
  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar" style="color: var(--text-primary);">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="6" width="3" height="6" rx="0.8"/><rect x="4.5" y="4" width="3" height="8" rx="0.8"/><rect x="9" y="2" width="3" height="10" rx="0.8"/><rect x="13.5" y="0" width="3" height="12" rx="0.8"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" fill="currentColor"/><path d="M1.5 5.5C3.4 3.5 5.6 2.5 8 2.5s4.6 1 6.5 3"/><path d="M4 8C5.2 6.7 6.5 6 8 6s2.8.7 4 2"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="0" y="1" width="21" height="10" rx="2.5"/><rect x="22" y="3.5" width="2" height="5" rx="1" fill="currentColor" opacity="0.5"/><rect x="1.5" y="2.5" width="16" height="7" rx="1.5" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- Nav Header -->
  <header class="chat-header">
    <a href="11-chats-lista.html" class="nav-btn" data-nav-back aria-label="Volver">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>

    <div class="chat-user-info">
      <div class="chat-avatar-box">
        <div class="avatar avatar-sm avatar-gradient-3" id="chatAvatar">CM</div>
        <div class="chat-online-dot" id="chatOnlineDot"></div>
      </div>
      <div>
        <div class="chat-name" id="chatName">Carlos Morales</div>
        <div class="chat-status" id="chatStatus">En línea</div>
      </div>
    </div>

    <!-- Actions -->
    <a href="tel:+" class="nav-btn" aria-label="Llamar">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </a>
  </header>

  <!-- Collapsible Agreement Strip -->
  <div class="chat-agreement-bar" id="chatAgreementBar">
    <div class="agreement-header">
      <div style="font-size:var(--text-xs); font-weight:600; color:var(--brand-primary); display:flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <span id="agreementLabel">Acuerdo activo: Taladro Bosch 18V (S/ 125.60 pagado)</span>
      </div>
      <a href="15-acuerdo-qr-alquiler.html" id="agreementLink" style="font-size:11px; font-weight:700; color:var(--brand-primary); text-decoration:none; display:flex; align-items:center; gap:2px;">
        Ver QR
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </div>
  </div>

  <!-- Chat Messages Feed (rendered by script) -->
  <div class="chat-feed" id="chatFeed"></div>

  <!-- Message Input Bar -->
  <div class="chat-input-bar">
    <button class="nav-btn" type="button" aria-label="Adjuntar foto">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <div class="chat-input-box">
      <input type="text" placeholder="Escribe un mensaje...">
    </div>
    <button class="nav-btn" type="button" aria-label="Enviar" style="background:var(--brand-primary); color:var(--text-on-dark); border-radius:50%;">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script src="shared.js"></script>
<script>
  (function () {
    var CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';

    var DATA = {
      carlos: {
        name: 'Carlos Morales', initials: 'CM', gradient: 'avatar-gradient-3', status: 'En línea', online: true,
        agreement: { label: 'Acuerdo activo: Taladro Bosch 18V (S/ 125.60 pagado)', href: '15-acuerdo-qr-alquiler.html' },
        date: 'Hoy, 24 de octubre',
        messages: [
          { from: 'provider', text: '¡Hola Diego! Vi tu solicitud del taladro percutor Bosch. Lo tengo disponible con las 2 baterías cargadas.', time: '10:23 AM' },
          { from: 'client', text: '¡Excelente Carlos! ¿Puedes entregarlo el sábado a primera hora en San Isidro?', time: '10:25 AM', read: true },
          { from: 'provider', text: 'Claro que sí, a las 9:00 AM estoy por tu dirección. Llevaré brocas de regalo para concreto y madera.', time: '10:26 AM' },
          { system: 'Pago confirmado de S/ 125.60 retenido en custodia segura' },
          { from: 'client', text: 'Perfecto, ya realicé el pago. Nos vemos el sábado a las 9:00 AM. ¡Muchas gracias!', time: '10:48 AM', read: true }
        ]
      },
      maria: {
        name: 'María V.', initials: 'MV', gradient: 'avatar-gradient-2', status: 'En línea', online: true,
        agreement: { label: 'Acuerdo activo: Hidrolavadora Kärcher (S/ 92.40 pagado)', href: '15-acuerdo-qr-alquiler.html' },
        date: 'Ayer, 23 de octubre',
        messages: [
          { from: 'provider', text: 'Hola, ya tengo lista la hidrolavadora para el domingo. ¿Confirmas la hora de recojo?', time: '4:10 PM' },
          { from: 'client', text: 'Sí, paso a las 10:00 AM. ¿Incluye la manguera extendida?', time: '4:15 PM', read: true },
          { from: 'provider', text: 'Sí, incluye manguera de 10 m y boquilla extra. Te espero.', time: '4:18 PM' }
        ]
      },
      juan: {
        name: 'Juan Ríos', initials: 'JR', gradient: 'avatar-gradient-1', status: 'Últ. vez 11:02', online: false,
        agreement: null,
        date: 'Hoy, 24 de octubre',
        messages: [
          { from: 'client', text: 'Buenos días, ¿puedes revisar un cortocircuito en Miraflores?', time: '9:40 AM', read: true },
          { from: 'provider', text: 'Claro, puedo pasar hoy a las 3:00 PM. Te confirmo el costo al revisar.', time: '9:52 AM' },
          { from: 'client', text: 'Perfecto, te espero.', time: '9:55 AM', read: true }
        ]
      }
    };

    var key = new URLSearchParams(window.location.search).get('c') || 'carlos';
    var d = DATA[key] || DATA.carlos;

    document.getElementById('chatName').textContent = d.name;
    document.getElementById('chatStatus').textContent = d.status;
    var av = document.getElementById('chatAvatar');
    av.textContent = d.initials;
    av.className = 'avatar avatar-sm ' + d.gradient;
    document.getElementById('chatOnlineDot').style.display = d.online ? 'block' : 'none';

    var bar = document.getElementById('chatAgreementBar');
    var feed = document.getElementById('chatFeed');
    if (d.agreement) {
      document.getElementById('agreementLabel').textContent = d.agreement.label;
      document.getElementById('agreementLink').href = d.agreement.href;
    } else {
      bar.style.display = 'none';
      feed.style.top = 'calc(var(--statusbar-height) + var(--header-height))';
    }

    var html = '<div class="chat-date-chip">' + d.date + '</div>';
    d.messages.forEach(function (m) {
      if (m.system) {
        html += '<div style="align-self:center; background:var(--brand-accent-soft); border:1px solid var(--border-default); border-radius:var(--radius-full); padding:4px 14px; font-size:11px; font-weight:600; color:var(--brand-primary); display:flex; align-items:center; gap:6px; margin:var(--sp-2) 0;">' +
          CHECK + m.system + '</div>';
      } else {
        html += '<div class="msg ' + m.from + '"><div class="msg-bubble">' + m.text + '</div>' +
          '<div class="msg-meta">' + m.time + (m.read ? CHECK : '') + '</div></div>';
      }
    });
    feed.innerHTML = html;
  })();
</script>
</body>
</html>
